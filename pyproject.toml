[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-cli"
version = "0.1.0"
description = "Voice-to-Claude bridge for terminal"
requires-python = ">=3.11"
dependencies = [
    "mlx-audio>=0.4.0",
    "pydub>=0.25.1",
    "anthropic>=0.34.0",
    "pynput>=1.7.6",
    "sounddevice>=0.4.5",
    "numpy>=1.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
]

[project.scripts]
voice = "voice_cli.main:run"
